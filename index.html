<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D4BFF">
<title>TalkFlow｜每日情境英文對話</title>
<meta name="apple-mobile-web-app-title" content="TalkFlow">
<meta name="application-name" content="TalkFlow">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF6; --paper:#FBFCFF; --ink:#14213D; --muted:#5B6784;
  --accent:#3D4BFF; --on-accent:#FFFFFF; --sun:#FFC83D; --on-sun:#14213D;
  --ok:#168F62; --bad:#C7423F; --line:#C5CFE2; --bubble-user:#3D4BFF;
  --display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1526; --paper:#182239; --ink:#EAF0FF; --muted:#9BA8C9;
    --accent:#7F8BFF; --on-accent:#0E1526; --line:#2B3857; --bubble-user:#5A68F5;
    --ok:#4CC38F; --bad:#F0807C;
  }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px 18px 28px;-webkit-overflow-scrolling:touch}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:6px 4px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Home */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:700;font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.levelhead{font-weight:700;font-size:14px;margin-bottom:6px}
.levelnote{font-size:13px;color:var(--muted);margin:8px 0 22px;line-height:1.5}
.levelbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:32px}
.levelbar .chip{border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.levelbar .chip b{font-family:var(--display);font-size:17px}
.levelbar .chip small{font-size:12px;opacity:.8}
.hello{font-size:30px;font-weight:700;margin:22px 0 6px;max-width:12em}
.streak{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px}
.streak b{background:var(--sun);color:var(--on-sun);border-radius:8px;padding:1px 9px}
.setup{background:var(--paper);border:1.5px dashed var(--accent);border-radius:14px;padding:16px;margin-bottom:20px}
.setup p{margin:0 0 10px}
.tickets{display:grid;gap:16px;perspective:900px}
.deck{position:relative;height:210px;margin:6px auto 26px;width:100%;max-width:340px}
.deck .back{position:absolute;left:50%;top:14px;width:78%;margin-left:-39%;aspect-ratio:720/440;background:url("card-back.png") center/100% 100% no-repeat;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.deck .b1{transform:rotate(-7deg)}
.deck .b2{transform:rotate(5deg)}
.deck .b3{transform:rotate(-1deg)}
.deck.shuffle .b1{animation:sh1 .5s ease-in-out 4}
.deck.shuffle .b2{animation:sh2 .5s ease-in-out 4}
.deck.shuffle .b3{animation:sh3 .5s ease-in-out 4}
@keyframes sh1{0%,100%{transform:rotate(-7deg)}30%{transform:translateX(-40px) rotate(-14deg)}60%{transform:translateX(36px) rotate(8deg)}}
@keyframes sh2{0%,100%{transform:rotate(5deg)}30%{transform:translateX(40px) rotate(12deg)}60%{transform:translateX(-36px) rotate(-8deg)}}
@keyframes sh3{0%,100%{transform:rotate(-1deg)}30%{transform:translateY(-18px) rotate(3deg)}60%{transform:translateY(8px) rotate(-3deg)}}
.deck.out{animation:deckout .35s ease-in both}
@keyframes deckout{to{opacity:0;transform:translateY(-16px) scale(.9)}}
.drawbtn{width:100%;font-size:18px;padding:14px}
.drawhint{text-align:center;font-size:14px;margin:10px 0 0}
.ticket.deal{animation:deal .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * .25s)}
@keyframes deal{from{opacity:0;transform:translateY(-36px) rotateX(75deg) scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.deck.shuffle .back{animation:none}.ticket.deal{animation:none}.deck.out{animation:none;opacity:0}}
.ticket{display:grid;grid-template-columns:78px 1fr;background:var(--paper);border:1px solid var(--line);border-radius:14px;position:relative;text-align:left;width:100%;padding:0;overflow:visible}
.ticket::before,.ticket::after{content:"";position:absolute;left:69px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.ticket::before{top:-10px}.ticket::after{bottom:-10px}
.ticket .stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-right:2px dashed var(--line);padding:14px 4px;font-size:30px;line-height:1}
.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.ticket .main{padding:14px 16px 14px 16px}
.ticket h3{font-size:20px}
.ticket .place{font-size:13px;color:var(--muted);margin:2px 0 8px}
.ticket .goal{font-size:14.5px}
.ticket .tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 7px;margin:8px 6px 0 0;color:var(--muted)}
.ticket .tag.lvl{color:var(--accent);border-color:var(--accent)}
.ticket:hover{border-color:var(--accent)}
.ticket.done .main{opacity:.6}
.stamp{position:absolute;right:12px;top:10px;transform:rotate(-8deg);border:2px solid var(--ok);color:var(--ok);font-weight:700;font-size:13px;padding:0 8px;border-radius:6px;font-family:var(--display)}
.foot{display:flex;justify-content:center;gap:18px;margin-top:26px}

/* Chat */
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-head .who{flex:1;min-width:0}
.chat-head .who b{font-family:var(--display);font-size:18px;display:block;line-height:1.2}
.chat-head .who span{font-size:12.5px;color:var(--muted)}
.icon-btn{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-size:14px}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mission{margin:10px 14px 0;padding:8px 12px;border-radius:10px;background:var(--paper);border:1px dashed var(--line);font-size:14px}
.mission b{color:var(--accent)}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;max-width:86%}
.msg.ai{align-self:flex-start}.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{padding:10px 14px;border-radius:16px;line-height:1.5;font-size:16.5px;word-break:break-word}
.ai .bubble{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.me .bubble{background:var(--bubble-user);color:var(--on-accent);border-bottom-right-radius:4px}
.t{transition:filter .15s}
.nosubs .ai .t{filter:blur(6px);cursor:pointer;-webkit-user-select:none;user-select:none}
@media (prefers-reduced-motion:reduce){.t{transition:none}}
.tools{display:flex;gap:6px;margin-top:5px}
.tools button{background:transparent;color:var(--muted);font-size:14px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);touch-action:manipulation}
.trl{font-size:14px;color:var(--muted);margin-top:4px;padding-left:4px}
.sys{align-self:center;font-size:13.5px;color:var(--muted);text-align:center;max-width:92%}
.sys .btn{margin-top:6px;padding:6px 14px}
.typing{align-self:flex-start;color:var(--muted);font-size:14px;padding-left:6px}
.hint{margin:0 14px 8px;padding:10px 12px;border-radius:12px;background:var(--sun);color:var(--on-sun);font-size:14.5px;white-space:pre-wrap}
.composer{padding:10px 14px 14px;border-top:1px solid var(--line);background:var(--bg)}
.inline{display:flex;gap:8px;margin-bottom:12px}
.inline input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}
.mic svg{width:32px;height:32px}
.mic.rec{background:var(--bad);animation:pulse 1.2s ease-in-out infinite}
.mic:disabled{opacity:.4}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--bad) 18%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.mic-label{font-size:13.5px;color:var(--muted)}
.endbar{display:flex;gap:10px;justify-content:center}

/* Feedback */
.fb-head{display:flex;gap:14px;align-items:center;margin:6px 0 18px}
.badge{flex:none;width:92px;height:92px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;text-align:center;font-family:var(--display);transform:rotate(-6deg)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge b{font-size:30px;line-height:1}.badge small{display:block;font-size:12px;font-weight:500}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:8px}
.card ul{margin:0;padding-left:20px}
.fix{padding:10px 0;border-top:1px solid var(--line)}.fix:first-of-type{border-top:0;padding-top:0}
.fix .o{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.fix .b{color:var(--ok);font-weight:500}
.fix .r{font-size:14px;color:var(--muted)}
.tip{background:var(--sun);color:var(--on-sun);border-radius:14px;padding:12px 16px;margin-bottom:14px}
details.tr summary{cursor:pointer;color:var(--muted)}
.tr p{margin:8px 0 0;font-size:15px}.tr p b{font-family:var(--display)}

/* Settings / history */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:500}
.field input,.field select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px;width:100%}
.two{display:grid;grid-template-columns:1fr 110px;gap:8px}
.check{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hist{display:grid;gap:10px}
.hist button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.hist .s{font-family:var(--display);font-weight:700;font-size:20px}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.page-head h2{font-size:24px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;max-width:88%;z-index:9;text-align:center}
.toast[hidden]{display:none}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="scroll">
      <div class="top">
        <span class="brand">TalkFlow</span>
      </div>
      <h1 class="hello">今天想跟誰聊聊？</h1>
      <div class="streak" id="streak"></div>
      <div class="levelhead">對話難度</div>
      <div class="levelbar" id="levelBar" role="group" aria-label="選擇對話難度"></div>
      <div id="setupBox"></div>
      <div id="drawPanel">
        <div class="deck" id="deck" aria-hidden="true"><div class="back b1"></div><div class="back b2"></div><div class="back b3"></div></div>
        <button class="btn sun drawbtn" id="drawBtn">抽選今日的票卡</button>
      </div>
      <div class="tickets" id="tickets"></div>
      <div class="foot">
        <button class="link" id="goAll">自由練習</button>
        <button class="link" id="goHistory">練習紀錄</button>
        <button class="link" id="goSettings">設定</button>
      </div>
    </div>
  </section>

  <!-- CHAT -->
  <section class="view" id="v-chat" hidden>
    <div class="chat-head">
      <button class="icon-btn" id="chatBack" aria-label="離開對話">←</button>
      <div class="who"><b id="chatRole"></b><span id="chatPlace"></span></div>
      <button class="icon-btn" id="subsBtn" aria-pressed="true" title="字幕">字幕：開</button>
      <button class="icon-btn" id="hintBtn">提示</button>
    </div>
    <div class="mission" id="mission"></div>
    <div id="msgs"></div>
    <div class="hint" id="hintBox" hidden></div>
    <div class="composer">
      <div id="endBar" class="endbar" hidden>
        <button class="btn" id="seeFb">看回饋</button>
        <button class="btn ghost" id="again2">再練一次</button>
      </div>
      <div id="inputArea">
        <div class="inline">
          <input id="textIn" type="text" placeholder="也可以直接打字回答" autocomplete="off" autocapitalize="sentences" enterkeyhint="send">
          <button class="btn" id="sendBtn">送出</button>
        </div>
        <div class="micwrap">
          <button class="mic" id="micBtn" aria-label="開始錄音">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
          </button>
          <span class="mic-label" id="micLabel">點一下開始說</span>
          <button class="link" id="finishEarly" hidden>結束對話，看回饋</button>
        </div>
      </div>
    </div>
  </section>

  <!-- FEEDBACK -->
  <section class="view" id="v-fb" hidden>
    <div class="scroll" id="fbBody"></div>
  </section>

  <!-- ALL SCENARIOS -->
  <section class="view" id="v-all" hidden>
    <div class="scroll">
      <div class="page-head"><button class="icon-btn" data-home aria-label="返回">←</button><h2>全部情境</h2></div>
      <div class="chips" id="tagChips" style="margin-bottom:16px"></div>
      <div class="tickets" id="allTickets"></div>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="view" id="v-hist" hidden>
    <div class="scroll">
      <div class="page-head"><button class="icon-btn" data-home aria-label="返回">←</button><h2>練習紀錄</h2></div>
      <div class="hist" id="histList"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-set" hidden>
    <div class="scroll">
      <div class="page-head"><button class="icon-btn" data-home aria-label="返回">←</button><h2>設定</h2></div>
      <div class="field">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="gsk_..." autocomplete="off">
        <span class="muted" style="font-size:14px">可到 <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> 登入後取得免費API Key。</span>
      </div>
      <div class="field">
        <label for="rate">說話速度</label>
        <select id="rate">
          <option value="0.8">慢</option><option value="0.95">正常</option><option value="1.1">快</option>
        </select>
      </div>
      <div class="check"><input type="checkbox" id="optSubs"><label for="optSubs">每次對話一開始就顯示英文字幕（預設關閉）</label></div>
      <div class="check"><input type="checkbox" id="optAuto"><label for="optAuto">語音辨識完直接送出（不先確認文字）</label></div>
      <details style="margin-bottom:16px">
        <summary class="muted">進階：模型</summary>
        <p class="muted" style="font-size:13.5px;margin:8px 0 10px">Groq 會不定期下架模型。如果突然全部連不上，先按下面的「載入可用模型」，再重新選一個。gpt-oss 這類推理型模型每句話會比較慢。</p>
        <button class="btn ghost" id="loadModels" type="button">載入可用模型</button>
        <div class="field" style="margin-top:12px"><label for="mLlm">對話模型</label><select id="mLlm"></select></div>
        <div class="field"><label for="mFb">備用模型（主模型額度用完時使用）</label><select id="mFb"></select></div>
        <div class="field"><label for="mStt">語音辨識模型</label><select id="mStt"></select></div>
      </details>
      <div style="display:flex;gap:10px">
        <button class="btn" id="saveSet">儲存</button>
        <button class="btn ghost" id="testKey">測試連線</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>

<script>
"use strict";
/* ============ 設定與資料 ============ */
const API = "https://api.groq.com/openai/v1";
const KEY = "talktoday.v1";
const LEVELS = { A2: "初級 A2", B1: "中級 B1", B2: "中高級 B2" };
const LEVEL_NOTE = {
  A2: "Use very simple, common words and short sentences. Speak slowly and clearly. No idioms or slang.",
  B1: "Use everyday vocabulary and clear, natural sentences. Avoid rare idioms.",
  B2: "Speak naturally, with occasional idioms and follow-up questions."
};

const sc = (id,emoji,role,title,tag,diff,place,goal,goalEn,persona,turns) =>
  ({ id,emoji,role,title,tag,diff,place,goal,goalEn,persona,turns });
const FR = "a close friend chatting casually and warmly. You share your own short opinions and ask follow-up questions, like a real friend. ";
const SCENARIOS = [
  /* ---- 簡單 ---- */
  sc("cafe","☕","Barista","咖啡廳店員","日常",1,"街角咖啡廳櫃檯","點一杯無咖啡因的飲料，決定內用或外帶，並付款","order a decaf drink, say whether it is for here or to go, and pay","a friendly, slightly busy barista. You ask what they would like, size, milk, for here or to go, then tell the total price.",5),

function pickIdx(len, last){ let i; do { i = Math.floor(Math.random()*len); } while (len > 1 && i === last); return i; }
function makeVariant(scn){
  const last = S.lastV[scn.id] || {};
  const pool = (scn.tag === "朋友閒聊" || SOCIAL_IDS.has(scn.id)) ? TWISTS_SOCIAL : TWISTS_SERVICE;
  const m = pickIdx(MOODS.length, last.m), t = pickIdx(pool.length, last.t);
  const angles = ANGLES[scn.id];
  const a = angles ? pickIdx(angles.length, last.a) : null;
  const named = !/^[A-Z][a-z]+, /.test(scn.persona);
  S.lastV[scn.id] = { m, t, a }; save();
  return { mood: MOODS[m], twist: pool[t], angle: angles ? angles[a] : null,
    name: named ? NAMES[Math.floor(Math.random()*NAMES.length)] : null };
}

function load(){
  const d = DEFAULTS();
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && typeof raw === "object") {
      const rawSettings = { ...(raw.settings || {}) };
      if (rawSettings.subsV !== 3) { rawSettings.subs = false; rawSettings.subsV = 3; }
      raw.settings = rawSettings;
      let level = raw.level;
      if (!level && Array.isArray(raw.profiles)) {   // 從舊版（雙使用者）轉換
        const old = raw.profiles.find(p => p.id === raw.active) || raw.profiles[0];
        level = old && old.level;
      }
      const out = { ...d, apiKey: raw.apiKey || "", level: LEVELS[level] ? level : d.level, drawnDate: raw.drawnDate || "", lastV: raw.lastV || {},
        settings: { ...d.settings, ...(raw.settings||{}) },
        history: Array.isArray(raw.history) ? raw.history : [] };
      for (const k of ["llm","llmFallback"]) if (RETIRED.includes(out.settings[k])) out.settings[k] = d.settings[k];
      return out;
    }
  } catch(e){}

}

/* 以「日期 + 使用者」當種子，同一天結果固定 */
function hash(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function dailyPicks(){
  const today = todayStr(), r = rng(hash(today + "talk-today"));
  const recent = new Set(S.history.filter(h => dayDiff(h.date,today)>0 && dayDiff(h.date,today)<7).map(h=>h.scenarioId));
  return [1,2,3].map(d => {
    let pool = SCENARIOS.filter(s => s.diff===d && !recent.has(s.id));
    if (!pool.length) pool = SCENARIOS.filter(s => s.diff===d);
    return pool[Math.floor(r()*pool.length)];
  });
}
function streakOf(){
  const days = new Set(S.history.map(h=>h.date));
  let d = new Date(), n = 0;
  if (!days.has(d.toLocaleDateString("sv-SE"))) d.setDate(d.getDate()-1);
  while (days.has(d.toLocaleDateString("sv-SE"))) { n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ============ Groq API ============ */
function friendlyErr(status, body){
  if (status===401) return "API Key 無效或未填寫，請到「設定」檢查。";
  if (status===429) return "免費額度或速率到上限了，等一下再試。";
  if (status===413) return "錄音檔太大，請說短一點。";
  if (status===0) return "連不上網路或被瀏覽器擋下，請檢查連線。";
  if (status===404 || /decommission|model_not_found|does not exist|no longer supported/i.test(body || "")) return "這個模型已經下架或不能用，請到「設定 → 進階」按「載入可用模型」重新選擇。";
  let m = ""; try { m = JSON.parse(body).error.message; } catch(e){}
  return "服務錯誤（" + status + "）" + (m ? "：" + m : "");
}
/* 推理型模型（gpt-oss、qwen3）會先「想」再回答，想的內容也算進字數上限，
   所以要降低推理強度、隱藏推理內容，並多給一些額度，否則回答會是空白 */
function modelParams(model, max){
  if (/gpt-oss/i.test(model)) return { max_completion_tokens: max + 1200, reasoning_effort:"low", include_reasoning:false };
  if (/qwen3/i.test(model)) return { max_completion_tokens: max + 200, reasoning_effort:"none" };
  return { max_tokens: max };
}
async function groqPost(model, params, messages, temp, json){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(API + "/chat/completions", {
      method:"POST", signal: ctl.signal,
      headers:{ "Authorization":"Bearer "+S.apiKey, "Content-Type":"application/json" },
      body: JSON.stringify({ model, messages, temperature:temp, ...params,
        ...(json ? { response_format:{ type:"json_object" } } : {}) })
    });
    if (res.ok) return { ok:true, data: await res.json() };
    return { ok:false, status:res.status, body: await res.text() };
  } catch(e){ return { ok:false, status:0, aborted: !!(e && e.name === "AbortError") }; }
  finally { clearTimeout(timer); }
}
async function groqChatRaw(messages, { json=false, max=200, temp=0.7 } = {}){
  if (!S.apiKey) throw new Error(friendlyErr(401));
  let last;
  for (const model of [S.settings.llm, S.settings.llmFallback].filter(Boolean)) {
    // 推理型模型：先用「低推理」設定；若被拒絕或回空白，再用一般設定加大額度重試
    const sets = [modelParams(model, max)];
    if (!("max_tokens" in sets[0])) sets.push({ max_completion_tokens: max + 1500 });
    for (let k = 0; k < sets.length; k++) {
      const r = await groqPost(model, sets[k], messages, temp, json);
      if (r.ok) {
        const c = r.data.choices?.[0];
        const out = String(c?.message?.content || "").replace(/<think>[\s\S]*?<\/think>/gi, "").trim();
        if (out) return { text: out, finish: c?.finish_reason || "" };
        last = new Error("AI 沒有回應，請再試一次。");
        if (k + 1 < sets.length) continue;
        break;
      }
      if (r.status === 0) { last = new Error(r.aborted ? "連線逾時，請再試一次。" : friendlyErr(0)); break; }
      last = new Error(friendlyErr(r.status, r.body));
      if (r.status === 401) throw last;
      if (r.status === 400 && k + 1 < sets.length && /reasoning|unsupported|unrecognized|unknown|invalid/i.test(r.body)) continue;
      break;
    }
  }
  throw last;
}
const groqChat = async (messages, opts) => (await groqChatRaw(messages, opts)).text;
async function groqSTT(blob, ext, context){
  if (!S.apiKey) throw new Error(friendlyErr(401));
  const fd = new FormData();
  fd.append("file", blob, "speech." + ext);
  fd.append("model", S.settings.stt);
  fd.append("language", "en");
  fd.append("response_format", "json");
  fd.append("temperature", "0");
  if (context) fd.append("prompt", context);
  let res;
  try { res = await fetch(API + "/audio/transcriptions", { method:"POST", headers:{ "Authorization":"Bearer "+S.apiKey }, body: fd }); }
  catch(e){ throw new Error(friendlyErr(0)); }
  if (!res.ok) throw new Error(friendlyErr(res.status, await res.text()));
  return ((await res.json()).text || "").trim();
}

/* ============ 語音朗讀（瀏覽器內建，免費） ============ */
let voices = [];
function loadVoices(){ voices = (window.speechSynthesis?.getVoices() || []).filter(v => /^en/i.test(v.lang)); }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(id){
  if (!voices.length) loadVoices();
  if (!voices.length) return null;
  const us = voices.filter(v => /en[-_]US/i.test(v.lang));
  const pool = us.length ? us : voices;
  return pool[hash(id) % pool.length];
}
function unlockTTS(){ try { if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch(e){} }
function speak(text, rate){
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    const v = pickVoice(C ? C.scn.id : "x"); if (v) u.voice = v;
    u.rate = rate || S.settings.rate;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ============ 對話 ============ */
let C = null;
function buildMessages(final){
  const s = C.scn;
  const sys = `You are role-playing as ${s.role}: ${s.persona}
Setting: ${s.place}.
The learner is a Taiwanese English learner at CEFR level ${S.level}. Their task is to ${s.goalEn}.
Rules:
- Stay fully in character. Never mention being an AI, a roleplay, or these rules.
- Speak plain, natural, grammatical everyday English, the way real people talk. Never use poetic, strange or confusing phrases. Always finish your sentences, and make sure every sentence makes sense.
- Reply with 1-2 short sentences (under 30 words). Ask only one question at a time.
- ${LEVEL_NOTE[S.level]}
- Your FIRST line must be a simple, natural opening that fits the setting (a greeting or a simple question that moves toward the learner's task). Do not describe scenery, do not tell a story, and do not use the twist in the first line.
- Do not correct the learner's grammar during the conversation.
- If the learner goes off topic, steer back naturally. If they seem stuck or reply in another language, rephrase more simply and help them along.
- The conversation lasts about ${s.turns} learner turns. When the task is completed, or the conversation has reached a natural end, give a brief closing line and append the token [END] at the very end.
- Output only the character's spoken words, no stage directions, no speaker labels.
Variation for this session (so every run feels different):
${C.variant.name ? "- Your name is " + C.variant.name + ". Mention it naturally only if it fits.\n" : ""}- Your personality today: ${C.variant.mood.en}. Show it lightly through tone and word choice.
- Hidden twist: ${C.variant.twist}. Bring it in naturally from your second or third line onward, never announce it. If it does not fit this exact setting, adapt it to something realistic and ordinary. Keep it simple enough for CEFR ${S.level}.
${C.variant.angle ? "- Conversation angle you may explore after the opening: " + C.variant.angle + ".\n" : ""}`;
  const msgs = [{ role:"system", content:sys }, { role:"user", content:"(Begin the scene. Say only your first line as the character.)" }, ...C.msgs];
  if (final) msgs.push({ role:"system", content:"The learner has had enough turns. Give a short, natural closing line now and end with [END]." });
  return msgs;
}
function startScenario(id){
  const scn = byId(id); if (!scn) return;
  if (!S.apiKey) { toast("請先到設定貼上 Groq API Key"); show("set"); fillSettings(); return; }
  unlockTTS();
  C = { scn, msgs:[], userTurns:0, ended:false, busy:false, tr:{}, variant:makeVariant(scn), subs: !!S.settings.subs };
  $("#chatRole").textContent = scn.role + (C.variant.name ? "・" + C.variant.name : "");
  $("#chatPlace").textContent = scn.place;
  $("#mission").innerHTML = `<b>你的任務：</b>${esc(scn.goal)}`;
  $("#msgs").innerHTML = "";
  $("#msgs").classList.toggle("nosubs", !C.subs);
  setSubsBtn();
  $("#hintBox").hidden = true;
  $("#endBar").hidden = true; $("#inputArea").hidden = false;
  $("#textIn").value = ""; $("#finishEarly").hidden = true;
  show("chat");
  aiTurn(false);
}
function addMsg(who, text){
  const el = document.createElement("div");
  el.className = "msg " + who;
  const idx = C.msgs.length - 1;
  el.dataset.i = idx;
  el.innerHTML = `<div class="bubble"><span class="t">${esc(text)}</span></div>` +
    (who === "ai" ? `<div class="tools"><button data-a="play">▶ 重播</button><button data-a="slow">慢速</button><button data-a="tr">翻譯</button></div><div class="trl" hidden></div>` : "");
  $("#msgs").appendChild(el);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
}
function addSys(html){ const el=document.createElement("div"); el.className="sys"; el.innerHTML=html; $("#msgs").appendChild(el); $("#msgs").scrollTop=$("#msgs").scrollHeight; return el; }
function setBusy(b, label){
  C.busy = b;
  $("#micBtn").disabled = b; $("#sendBtn").disabled = b; $("#textIn").disabled = b; $("#hintBtn").disabled = b;
  $("#micLabel").textContent = b ? (label || "請稍候…") : "點一下開始說";
  document.querySelectorAll(".typing").forEach(e => e.remove());
  if (b && label && label.includes("回答")) { const t=document.createElement("div"); t.className="typing"; t.innerHTML='<span class="spin"></span>' + esc(label); $("#msgs").appendChild(t); $("#msgs").scrollTop=$("#msgs").scrollHeight; }
}
function cleanLine(raw){ return String(raw).replace(/\[END\]/ig, "").trim().replace(/^["“]|["”]$/g, "").trim(); }
function looksComplete(t){ return t.split(/\s+/).length >= 2 && /[.!?…]["”’')\]]*$/.test(t); }
function trimToSentence(t){ const m = t.match(/^[\s\S]*[.!?…]["”’')\]]*/); return m ? m[0].trim() : t; }
async function getAiLine(final){
  let kept = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    const msgs = buildMessages(final);
    if (attempt) msgs.push({ role:"system", content:"Your previous reply was cut off or unclear. Reply again with one or two short, complete, natural sentences." });
    const r = await groqChatRaw(msgs, { max:220, temp: attempt ? 0.4 : 0.6 });
    const text = cleanLine(r.text);
    if (r.finish !== "length" && looksComplete(text)) return r.text;
    if (!kept || text.length > kept.text.length) kept = { raw:r.text, text };
  }
  const end = /\[END\]/i.test(kept.raw);
  const fixed = trimToSentence(kept.text);
  return fixed + (end ? " [END]" : "");
}
async function aiTurn(final){
  const mine = C;
  setBusy(true, "對方正在回答…");
  try {
    const raw = await getAiLine(final);
    if (C !== mine) return;
    const end = /\[END\]/i.test(raw);
    const text = raw.replace(/\[END\]/ig, "").replace(/^["“]|["”]$/g, "").trim() || "…";
    C.msgs.push({ role:"assistant", content:text });
    addMsg("ai", text); speak(text);
    if (end || final) { C.ended = true; $("#endBar").hidden = false; $("#inputArea").hidden = true; }
    $("#finishEarly").hidden = C.userTurns < 1 || C.ended;
  } catch(e){
    if (C !== mine) return;
    const el = addSys(`${esc(e.message)}<br><button class="btn ghost" data-a="retry">重試</button>`);
    el.dataset.retry = final ? "final" : "normal";
  } finally { if (C === mine) setBusy(false); }
}
function sendUser(text){
  text = (text || "").trim();
  if (!text || C.busy || C.ended) return;
  stopSpeaking();
  C.msgs.push({ role:"user", content:text });
  C.userTurns++;
  addMsg("me", text);
  $("#textIn").value = ""; $("#hintBox").hidden = true;
  aiTurn(C.userTurns >= C.scn.turns);
}
function stopSpeaking(){ try { speechSynthesis.cancel(); } catch(e){} }

/* 提示、翻譯 */
async function getHint(){
  if (!C || C.ended) return;
  if (C.busy) { toast("對方還在回應，等一下再按提示"); return; }
  const mine = C, btn = $("#hintBtn"), box = $("#hintBox");
  btn.disabled = true; btn.textContent = "思考中…";
  box.hidden = false; box.textContent = "想一下…";
  try {
    const t = await groqChat([
      { role:"system", content:`You help a Taiwanese English learner (CEFR ${S.level}) in a roleplay with a ${mine.scn.role}. Their task: ${mine.scn.goalEn}. Based on the conversation, suggest 2 different short replies they could say next (natural spoken English, under 15 words each). Format exactly:\n1. <English> （<繁體中文意思>）\n2. <English> （<繁體中文意思>）\nNothing else.` },
      { role:"user", content: mine.msgs.map(m => (m.role==="user" ? "Learner: " : mine.scn.role + ": ") + m.content).join("\n") || "(The scene has not started.)" }
    ], { max:300, temp:0.6 });
    if (C === mine) box.textContent = t;
  } catch(e){
    if (C === mine) { box.textContent = e.message; toast(e.message, 4000); }
  } finally {
    btn.textContent = "提示";
    if (C === mine && !C.busy) btn.disabled = false;
  }
}
async function translateMsg(el, btn){
  const mine = C, i = +el.dataset.i, out = el.querySelector(".trl");
  if (!out.hidden && out.textContent && out.textContent !== "翻譯中…") { out.hidden = true; return; }
  out.hidden = false;
  const reveal = () => { try { out.scrollIntoView({ block:"nearest", behavior:"smooth" }); } catch(e){} };
  if (C.tr[i]) { out.textContent = C.tr[i]; reveal(); return; }
  out.textContent = "翻譯中…"; reveal();
  if (btn) { btn.disabled = true; btn.textContent = "翻譯中…"; }
  try {
    const t = await groqChat([
      { role:"system", content:"Translate the English text into natural Traditional Chinese (Taiwan usage). Output only the translation." },
      { role:"user", content:C.msgs[i].content }], { max:300, temp:0.2 });
    mine.tr[i] = t; if (C === mine) { out.textContent = t; reveal(); }
  } catch(e){ out.textContent = e.message; toast(e.message, 4000); out.hidden = false; }
  finally { if (btn) { btn.disabled = false; btn.textContent = "翻譯"; } }
}

/* ============ 錄音 ============ */
let rec=null, stream=null, chunks=[], recTimer=null, recStart=0, recCancel=false;
async function toggleRec(){
  if (rec && rec.state === "recording") { stopRec(false); return; }
  if (C.busy || C.ended) return;
  stopSpeaking();
  if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) { toast("這個瀏覽器不支援錄音，請改用打字"); return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }); }
  catch(e){ toast("無法使用麥克風，請在瀏覽器允許麥克風權限（網頁需為 https）", 4500); return; }
  const types = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || "";
  try { rec = new MediaRecorder(stream, mime ? { mimeType:mime } : {}); }
  catch(e){ toast("無法開始錄音，請改用打字"); stream.getTracks().forEach(t=>t.stop()); return; }
  chunks = []; recCancel = false;
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = onRecStop;
  rec.start(); recStart = Date.now();
  $("#micBtn").classList.add("rec");
  $("#micBtn").setAttribute("aria-label", "停止錄音");
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now()-recStart)/1000);
    $("#micLabel").textContent = `錄音中 ${s} 秒，點一下結束`;
    if (s >= 30) stopRec(false);
  }, 250);
  $("#micLabel").textContent = "錄音中 0 秒，點一下結束";
}
function stopRec(cancel){
  recCancel = !!cancel;
  clearInterval(recTimer);
  if (rec && rec.state === "recording") rec.stop();
}
async function onRecStop(){
  clearInterval(recTimer);
  stream && stream.getTracks().forEach(t => t.stop());
  $("#micBtn").classList.remove("rec");
  $("#micBtn").setAttribute("aria-label", "開始錄音");
  $("#micLabel").textContent = "點一下開始說";
  if (recCancel) return;
  const type = (rec.mimeType || "audio/webm").split(";")[0];
  const blob = new Blob(chunks, { type });
  if (Date.now() - recStart < 700 || blob.size < 1500) { toast("錄音太短了，再說一次"); return; }
  const ext = type.includes("mp4") ? "mp4" : type.includes("ogg") ? "ogg" : "webm";
  const mine = C;
  let autoText = null;
  setBusy(true, "辨識中…");
  try {
    const text = await groqSTT(blob, ext, `A conversation with a ${C.scn.role}.`);
    if (C !== mine) return;
    if (!text) { toast("沒聽到聲音，再說一次"); }
    else {
      $("#textIn").value = text;
      if (S.settings.autoSend) autoText = text;
      else toast("確認一下文字，可修改後按送出", 3200);
    }
  } catch(e){ toast(e.message, 4500); }
  if (C !== mine) return;
  setBusy(false);
  if (autoText) sendUser(autoText);
}

/* ============ 回饋 ============ */
async function finish(){
  if (!C || C.userTurns < 1) { renderHome(); return; }
  stopSpeaking(); stopRec(true);
  const mine = C;
  show("fb");
  $("#fbBody").innerHTML = `<p class="muted" style="margin-top:40px;text-align:center"><span class="spin"></span>教練正在整理回饋…</p>`;
  const transcript = C.msgs.map(m => (m.role==="user" ? "Learner: " : C.scn.role + ": ") + m.content).join("\n");
  const sys = `You are a warm, encouraging English speaking coach for a Taiwanese learner at CEFR ${S.level}.
You will read a roleplay transcript. The learner's task was to ${C.scn.goalEn}.
The learner's lines came from speech recognition, so ignore punctuation, capitalization and pronunciation. Judge only content, grammar and word choice.
Return ONLY a JSON object with this exact shape:
{"task_completed": true|false,
 "score": integer 0-100 (be fair and encouraging; most sincere attempts land between 60 and 95),
 "summary": "一句繁體中文總評，語氣鼓勵",
 "strengths": ["繁體中文，最多2點"],
 "corrections": [{"original":"learner's exact words","better":"a more natural or correct version","reason":"繁體中文簡短原因"}],
 "useful_phrases": ["English phrase：繁體中文意思"],
 "tip": "一句繁體中文的小建議"}
Rules: at most 3 corrections, only for real mistakes or clearly unnatural phrasing in the Learner's lines. If there is nothing to fix, use an empty array. At most 3 useful_phrases, taken from the character's lines or your improved versions.`;
  let fb;
  try {
    const raw = await groqChat([{ role:"system", content:sys }, { role:"user", content:transcript }], { json:true, max:900, temp:0.3 });
    fb = JSON.parse(raw);
  } catch(e){
    if (C !== mine) return;
    $("#fbBody").innerHTML = `<div class="card"><h3>回饋暫時產生不了</h3><p>${esc(e.message)}</p></div>
      <div style="display:flex;gap:10px"><button class="btn" id="retryFb">重試</button><button class="btn ghost" data-home>回首頁</button></div>`;
    return;
  }
  fb = normalizeFb(fb);
  S.history.unshift({ date:todayStr(), scenarioId:C.scn.id, score:fb.score, completed:fb.task_completed, msgs:C.msgs, fb });
  S.history = S.history.slice(0, 60); save();
  renderFb(fb, C.scn, true);
}
function normalizeFb(fb){
  const arr = a => Array.isArray(a) ? a : [];
  return {
    task_completed: !!fb.task_completed,
    score: Math.max(0, Math.min(100, Math.round(Number(fb.score) || 70))),
    summary: String(fb.summary || ""),
    strengths: arr(fb.strengths).slice(0,2).map(String),
    corrections: arr(fb.corrections).slice(0,3).filter(c => c && c.original && c.better),
    useful_phrases: arr(fb.useful_phrases).slice(0,3).map(String),
    tip: String(fb.tip || "")
  };
}
function renderFb(fb, scn, fresh, msgs){
  const list = msgs || (C && C.msgs) || [];
  $("#fbBody").innerHTML = `
    <div class="page-head"><button class="icon-btn" data-home aria-label="回首頁">←</button><h2>${esc(scn.title)}</h2></div>
    <div class="fb-head">
      <div class="badge ${fb.task_completed ? "ok" : ""}"><div><b>${fb.score}</b><small>${fb.task_completed ? "任務完成" : "再接再厲"}</small></div></div>
      <p style="margin:0;font-size:17px">${esc(fb.summary)}</p>
    </div>
    ${fb.strengths.length ? `<div class="card"><h3>你做得好的地方</h3><ul>${fb.strengths.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${fb.corrections.length ? `<div class="card"><h3>可以更自然的說法</h3>${fb.corrections.map(c => `
      <div class="fix"><div class="o">${esc(c.original)}</div><div class="b">${esc(c.better)}</div><div class="r">${esc(c.reason || "")}</div></div>`).join("")}</div>`
      : `<div class="card"><h3>可以更自然的說法</h3><p style="margin:0">這次沒有明顯要修的地方，很棒。</p></div>`}
    ${fb.useful_phrases.length ? `<div class="card"><h3>這次可以帶走的句子</h3><ul>${fb.useful_phrases.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${fb.tip ? `<div class="tip">${esc(fb.tip)}</div>` : ""}
    <details class="card tr"><summary>看完整對話</summary>
      ${list.map(m => `<p><b>${m.role==="user" ? "你" : esc(scn.role)}</b>：${esc(m.content)}</p>`).join("")}
    </details>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn" data-again="${scn.id}">再練一次</button>
      <button class="btn ghost" data-home>回首頁</button>
    </div>
    <p class="muted" style="font-size:13px;margin-top:16px">${fresh ? "語音辨識可能自動修正文法，所以這份回饋看的是內容與用字，不評發音。" : ""}</p>`;
  show("fb");
}

/* ============ 全部情境（自由挑選） ============ */
const DIFF_LABEL = { 1:"簡單", 2:"中等", 3:"挑戰" };
const ticketHTML = (s, cls="", style="") => `
    <button class="ticket ${cls}" ${style ? `style="${style}"` : ""} data-s="${s.id}">
      <div class="stub"><span aria-hidden="true">${s.emoji}</span>
        <span class="dots" aria-label="情境難度 ${s.diff}／3">${[1,2,3].map(i=>`<i class="${i<=s.diff?"on":""}"></i>`).join("")}</span></div>
      <div class="main">
        <h3>${esc(s.title)}</h3>
        <div class="place">${esc(s.place)}</div>
        <div class="goal">任務：${esc(s.goal)}</div>
        <span class="tag">${esc(s.tag)}</span><span class="tag lvl">情境${DIFF_LABEL[s.diff]}</span>
      </div>
    </button>`;
function renderAll(tag){
  tag = tag || "";
  const tags = ["", ...new Set(SCENARIOS.map(s => s.tag))];
  $("#tagChips").innerHTML = tags.map(t => `<button class="chip" data-tag="${esc(t)}" aria-pressed="${t===tag}">${t || "全部"}</button>`).join("");
  $("#allTickets").innerHTML = SCENARIOS.filter(s => !tag || s.tag === tag).map(s => ticketHTML(s)).join("");
  show("all");
}

/* ============ 紀錄、設定 ============ */
function renderHistory(){
  const items = S.history;
  $("#histList").innerHTML = items.length ? items.map((h,i) => {
    const s = byId(h.scenarioId) || { title:"對話", emoji:"💬" };
    return `<button data-h="${S.history.indexOf(h)}"><span>${s.emoji} ${esc(s.title)}<br><span class="muted" style="font-size:13px">${esc(h.date)}${h.completed ? "・任務完成" : ""}</span></span><span class="s">${h.score}</span></button>`;
  }).join("") : `<p class="muted">還沒有紀錄。回首頁挑一張票開始吧。</p>`;
  show("hist");
}
function setOptions(sel, list, current, allowEmpty){
  const ids = [...new Set([current, ...list].filter(Boolean))];
  sel.innerHTML = (allowEmpty ? '<option value="">（不使用備用模型）</option>' : "") +
    ids.map(id => `<option value="${esc(id)}">${esc(id)}</option>`).join("");
  sel.value = current || (allowEmpty ? "" : ids[0]);
}
function fillModelSelects(chat, stt, cur){
  const d = DEFAULTS().settings;
  cur = cur || S.settings;
  chat = chat || [d.llm, d.llmFallback]; stt = stt || [d.stt, "whisper-large-v3"];
  setOptions($("#mLlm"), chat, cur.llm, false);
  setOptions($("#mFb"), chat, cur.llmFallback, true);
  setOptions($("#mStt"), stt, cur.stt, false);
}
async function loadModels(){
  const key = $("#apiKey").value.trim() || S.apiKey;
  if (!key) { toast("請先貼上 Groq API Key"); return; }
  const btn = $("#loadModels"); btn.disabled = true; btn.textContent = "載入中…";
  try {
    const res = await fetch(API + "/models", { headers:{ "Authorization":"Bearer " + key } });
    if (!res.ok) throw new Error(friendlyErr(res.status, await res.text()));
    const ids = ((await res.json()).data || []).map(m => m.id).sort();
    const chat = ids.filter(id => !/whisper|orpheus|guard|safeguard|tts|embed/i.test(id));
    const stt = ids.filter(id => /whisper/i.test(id));
    const keep = { llm: $("#mLlm").value, fb: $("#mFb").value, stt: $("#mStt").value };
    // 目前選的模型如果已經不在清單裡，就自動改成清單中的第一個可用模型
    const cur = {
      llm: chat.includes(keep.llm) ? keep.llm : (chat.includes(DEFAULTS().settings.llm) ? DEFAULTS().settings.llm : chat[0] || keep.llm),
      llmFallback: chat.includes(keep.fb) ? keep.fb : "",
      stt: stt.includes(keep.stt) ? keep.stt : (stt[0] || keep.stt) };
    fillModelSelects(chat, stt, cur);
    toast(`找到 ${chat.length} 個對話模型、${stt.length} 個語音辨識模型。確認後按「儲存」`, 4500);
  } catch(e){ toast(e.message, 4500); }
  finally { btn.disabled = false; btn.textContent = "載入可用模型"; }
}
function fillSettings(){
  $("#apiKey").value = S.apiKey;
  $("#rate").value = String(S.settings.rate);
  if (![...$("#rate").options].some(o => o.value === String(S.settings.rate))) $("#rate").value = "0.95";
  $("#optSubs").checked = S.settings.subs; $("#optAuto").checked = S.settings.autoSend;
  fillModelSelects();
  show("set");
}
function saveSettings(){
  S.apiKey = $("#apiKey").value.trim();
  Object.assign(S.settings, {
    rate: parseFloat($("#rate").value) || 0.95, subs: $("#optSubs").checked, autoSend: $("#optAuto").checked,
    llm: $("#mLlm").value || DEFAULTS().settings.llm,
    llmFallback: $("#mFb").value, stt: $("#mStt").value || DEFAULTS().settings.stt });
  save();
}

/* ============ 事件 ============ */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.lv) { S.level = t.dataset.lv; save(); renderHome(); return; }
  if (t.dataset.tag !== undefined) { renderAll(t.dataset.tag); return; }
  if (t.dataset.s) { startScenario(t.dataset.s); return; }
  if (t.hasAttribute("data-home")) { stopSpeaking(); stopRec(true); C = null; renderHome(); return; }
  if (t.dataset.again) { startScenario(t.dataset.again); return; }
  if (t.dataset.h !== undefined) {
    const h = S.history[+t.dataset.h]; if (!h) return;
    renderFb(normalizeFb(h.fb), byId(h.scenarioId) || { title:"對話", id:"", role:"AI" }, false, h.msgs); return;
  }
  const a = t.dataset.a;
  if (a === "play" || a === "slow") {
    const el = t.closest(".msg"); const m = C.msgs[+el.dataset.i]; speak(m.content, a === "slow" ? 0.65 : null); return;
  }
  if (a === "tr") { translateMsg(t.closest(".msg"), t); return; }
  if (a === "retry") { const el = t.closest(".sys"); const final = el.dataset.retry === "final"; el.remove(); aiTurn(final); return; }
});
$("#goSettings").onclick = fillSettings;
$("#drawBtn").onclick = drawToday;
$("#goHistory").onclick = renderHistory;
$("#goAll").onclick = () => renderAll("");
document.addEventListener("click", e => { if (e.target.id === "setupGo") fillSettings(); if (e.target.id === "retryFb") finish(); });
$("#loadModels").onclick = loadModels;
$("#saveSet").onclick = () => { saveSettings(); toast("已儲存"); renderHome(); };
$("#testKey").onclick = async () => {
  saveSettings(); toast("測試中…");
  try { await groqChat([{ role:"user", content:"Say OK." }], { max:20 }); toast("連線成功，可以開始練習了"); }
  catch(e){ toast(e.message, 4500); }
};
$("#chatBack").onclick = () => {
  if (C && C.userTurns > 0 && !C.ended && !confirm("離開後這次對話不會產生回饋，確定離開？")) return;
  stopSpeaking(); stopRec(true); C = null; renderHome();
};
function setSubsBtn(){
  const on = !!(C && C.subs);
  $("#subsBtn").setAttribute("aria-pressed", String(on));
  $("#subsBtn").textContent = on ? "字幕：開" : "字幕：關";
}
function toggleSubs(){      // 只影響目前這場對話；下一場一律回到預設
  if (!C) return;
  C.subs = !C.subs;
  setSubsBtn();
  $("#msgs").classList.toggle("nosubs", !C.subs);
}
$("#subsBtn").onclick = toggleSubs;
$("#msgs").addEventListener("click", e => {
  if (e.target.closest(".bubble") && e.target.closest(".msg.ai")) toggleSubs();   // 點 AI 的話 = 按上方字幕按鈕
});
$("#hintBtn").onclick = getHint;
$("#micBtn").onclick = toggleRec;
$("#sendBtn").onclick = () => sendUser($("#textIn").value);
$("#textIn").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendUser($("#textIn").value); } });
$("#finishEarly").onclick = finish;
$("#seeFb").onclick = finish;
$("#again2").onclick = () => startScenario(C.scn.id);
window.addEventListener("pagehide", () => { stopSpeaking(); });

renderHome();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
